name: Build IMAYX Host APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-24.04 runners ship the Android SDK (ANDROID_HOME) with sdkmanager.
      # We only make sure the exact platform / build-tools we need are present.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Install Gradle 8.9 (direct, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gradle-8.9-bin.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          EXPECTED="$(curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256)"
          echo "${EXPECTED}  /tmp/gradle-8.9-bin.zip" | sha256sum -c -
          unzip -q /tmp/gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          gradle --version
          java -version

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Android 10+ forbids exec() of binaries living in the app data dir for apps targeting API 29+.
      # Shipping cloudflared as a native library (extracted to nativeLibraryDir) is the supported way
      # to run it. The app still has an in-app installer as fallback if this step is skipped/fails.
      - name: Bundle official cloudflared (linux-arm64) as native lib
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          RELEASE_JSON="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/cloudflare/cloudflared/releases/latest)"
          URL="$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="cloudflared-linux-arm64") | .browser_download_url')"
          DIGEST="$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="cloudflared-linux-arm64") | .digest // empty')"
          test -n "$URL"
          curl -fsSL --retry 3 -o app/src/main/jniLibs/arm64-v8a/libcloudflared.so "$URL"
          if [ -n "$DIGEST" ]; then
            echo "${DIGEST#sha256:}  app/src/main/jniLibs/arm64-v8a/libcloudflared.so" | sha256sum -c -
          else
            echo "No digest published for asset; skipping checksum verification"
          fi
          file app/src/main/jniLibs/arm64-v8a/libcloudflared.so || true

      # Embedded Node.js for the in-app AyX Group backend (no Termux needed).
      # digidem/nodejs-mobile ships Node 24.x for Android arm64 — node:sqlite needs 22.5+.
      # Placed as a native lib (extracted to nativeLibraryDir); CMake links node_bridge against it.
      - name: Reassemble binary assets
        run: |
          set -euo pipefail
          # Binaries are stored as base64 text parts (GitHub file API is text-only).
          cat app/src/main/assets/ayx-backend.zip.b64.* | base64 -d > app/src/main/assets/ayx-backend.zip
          echo "ed9ba5cf20ad1028d7a7e4308c4d8e45051ce2df9d4a836f42aa49daf2d88344  app/src/main/assets/ayx-backend.zip" | sha256sum -c -
          cat app/src/main/assets/wish-service.zip.b64.* | base64 -d > app/src/main/assets/wish-service.zip
          cat gradle/wrapper/gradle-wrapper.jar.b64.* | base64 -d > gradle/wrapper/gradle-wrapper.jar
          ls -l app/src/main/assets/ayx-backend.zip app/src/main/assets/wish-service.zip gradle/wrapper/gradle-wrapper.jar

      - name: Bundle nodejs-mobile libnode.so as native lib
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            'https://api.github.com/repos/digidem/nodejs-mobile/releases?per_page=15' \
            | jq -r '.[].assets[] | select(.name | test("-android-.*\\.zip$")) | select(.name | test("lite") | not) | .browser_download_url' \
            | head -n1)"
          test -n "$URL"
          echo "Downloading $URL"
          curl -fsSL --retry 3 -o /tmp/node-android.zip "$URL"
          rm -rf /tmp/_node && mkdir -p /tmp/_node && unzip -q /tmp/node-android.zip -d /tmp/_node
          SO="$(find /tmp/_node -path '*arm64-v8a*' -name 'libnode.so' | head -n1)"
          test -n "$SO"
          echo "libnode.so: $SO"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$SO" app/src/main/jniLibs/arm64-v8a/libnode.so
          file app/src/main/jniLibs/arm64-v8a/libnode.so || true

      - name: Scan for committed secrets
        run: |
          set -euo pipefail
          if git grep -nE 'eyJ[A-Za-z0-9_-]{60,}|cfut_[A-Za-z0-9]{20,}' -- . ':!*.md' ':!.github'; then
            echo "Possible secret found in repository" >&2
            exit 1
          fi

      - name: Build debug APK
        run: |
          gradle assembleDebug -PbuildNative --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -l app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IMAYX-Host-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
